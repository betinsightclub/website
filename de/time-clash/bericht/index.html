<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031720"><title>TIME CLASH – Begegnungsbericht | BetInsight</title><style>:root{--bg:#020d14;--panel:#061b28;--line:#17445e;--cyan:#74d9ff;--gold:#f7c64e;--green:#3ce5a5;--muted:#9eb5c3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#123b56,#061925 34%,var(--bg) 72%);color:#f5fbff;font-family:Inter,system-ui,sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:28px 0 70px}a{color:var(--cyan)}.hero,.card{border:1px solid var(--line);background:linear-gradient(155deg,#092536ee,#04131dee);border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 20px 60px #0006}.ey{color:var(--gold);font-weight:900;letter-spacing:.13em;font-size:12px}.hero h1{margin:8px 0}.score{font-size:clamp(34px,7vw,68px);font-weight:1000;color:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.game,.event{border:1px solid #153f56;border-radius:13px;padding:13px;background:#03151f}.event{margin:7px 0}.muted{color:var(--muted)}h2{color:var(--cyan)}.reportCta{margin:30px 0 10px;text-align:center;border:1px solid #2b7697;background:linear-gradient(145deg,#08283a,#061a26);border-radius:20px;padding:28px}.reportCta h2{margin:0 0 10px;color:var(--gold)}.reportCta p{color:#d8e9f2;font-size:17px}.ctaBtn{display:inline-block;margin-top:10px;padding:14px 22px;border-radius:12px;background:linear-gradient(135deg,#19d6a3,#54c8ff);color:#021219!important;text-decoration:none;font-weight:1000;box-shadow:0 10px 30px #0006}</style></head><body><main class="wrap"><a href="/de/time-clash/">← Zurück zu TIME CLASH</a><section id="app" class="hero"><div class="ey">BETINSIGHT MATCH LAB</div><h1>TIME CLASH – Begegnungsbericht</h1><p>Bericht wird geladen…</p></section></main><script>
(async()=>{const app=document.getElementById("app"),slug=new URLSearchParams(location.search).get("clash"),API="https://lszlaglwlixejzytrurg.supabase.co/functions/v1/time-clash-report",esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));try{if(!slug)throw 0;const r=await fetch(API+"?slug="+encodeURIComponent(slug),{cache:"no-store"}),d=await r.json(),x=d.report;if(!x)throw 0;const ctx=(x.report_summary?.context||[]).map(p=>"<p>"+esc(p)+"</p>").join("");const narratives=(x.report_summary?.games||[]).map((z,i)=>'<section class="card"><h2>Spiel '+(i+1)+'</h2>'+((z.lines||[]).map(p=>"<p>"+esc(p)+"</p>").join(""))+"</section>").join("");const cards=(x.games||[]).map((g,i)=>'<div class="game"><b>Spiel '+(i+1)+'</b><div>'+esc(x.team_a)+" "+Number(g.ga||0)+" : "+Number(g.gb||0)+" "+esc(x.team_b)+'</div><small class="muted">'+esc(g.venue||"")+"</small></div>").join("");const scorers=(x.scorers||[]).map(s=>'<div class="event">⚽ <b>'+esc(s.player||"")+"</b> "+esc(s.minute||"")+"′ · "+esc(s.team||"")+(s.assist?" · Assist: "+esc(s.assist):"")+"</div>").join("");app.innerHTML='<div class="ey">BETINSIGHT MATCH LAB · '+new Date(x.created_at).toLocaleString("de-DE")+'</div><h1>'+esc(x.team_a)+' <span class="muted">vs.</span> '+esc(x.team_b)+'</h1><div class="score">'+esc(x.series_a)+" : "+esc(x.series_b)+'</div><p><b>Seriensieger:</b> '+esc(x.winner)+'</p><section class="card"><h2>Historischer Kontext & Ausgangslage</h2>'+ctx+'</section><section class="card"><h2>Serienübersicht</h2><div class="grid">'+cards+"</div></section>"+narratives+'<section class="card"><h2>Torschützen & Assists</h2>'+(scorers||'<p class="muted">Keine Torschützen gespeichert.</p>')+'</section><section class="reportCta"><h2>Schreibe deine eigene TIME-CLASH-Geschichte</h2><p>Erstelle deine eigene Mannschaft und tritt gegen die Stars der Vergangenheit oder Neuzeit an.</p><a class="ctaBtn" href="/de/time-clash/mein-team/">EIGENE MANNSCHAFT ERSTELLEN</a></section>'; }cat
