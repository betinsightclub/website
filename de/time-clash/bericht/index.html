<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031720"><title>TIME CLASH – Begegnungsbericht | BetInsight</title><style>:root{--bg:#020d14;--panel:#061b28;--line:#17445e;--cyan:#74d9ff;--gold:#f7c64e;--green:#3ce5a5;--muted:#9eb5c3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#123b56,#061925 34%,var(--bg) 72%);color:#f5fbff;font-family:Inter,system-ui,sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:28px 0 70px}a{color:var(--cyan)}.hero,.card{border:1px solid var(--line);background:linear-gradient(155deg,#092536ee,#04131dee);border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 20px 60px #0006}.ey{color:var(--gold);font-weight:900;letter-spacing:.13em;font-size:12px}.hero h1{margin:8px 0}.score{font-size:clamp(34px,7vw,68px);font-weight:1000;color:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.game,.event{border:1px solid #153f56;border-radius:13px;padding:13px;background:#03151f}.event{margin:7px 0}.muted{color:var(--muted)}h2{color:var(--cyan)}</style></head><body><main class="wrap"><a href="/de/time-clash/">← Zurück zu TIME CLASH</a><section id="app" class="hero"><div class="ey">BETINSIGHT MATCH LAB</div><h1>TIME CLASH – Begegnungsbericht</h1><p>Bericht wird geladen…</p></section></main><script>
(function(){
 const API="https://lszlaglwlixejzytrurg.supabase.co/functions/v1/time-clash-report";
 const app=document.getElementById("app"), slug=new URLSearchParams(location.search).get("clash");
 const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
 if(!slug){app.innerHTML="<h1>Bericht-ID fehlt.</h1>";return}
 const xhr=new XMLHttpRequest();
 xhr.open("GET",API+"?slug="+encodeURIComponent(slug)+"&v="+Date.now(),true);
 xhr.timeout=12000;
 xhr.onload=function(){try{
   if(xhr.status<200||xhr.status>=300)throw new Error("HTTP "+xhr.status);
   const d=JSON.parse(xhr.responseText),x=d.report;if(!x)throw new Error("Kein Bericht");
   const games=(x.games||[]).map((g,i)=>'<div class="game"><b>Spiel '+(i+1)+'</b><div>'+esc(x.team_a)+' '+Number(g.ga||0)+' : '+Number(g.gb||0)+' '+esc(x.team_b)+'</div></div>').join("");
   const sc=(x.scorers||[]).map(s=>'<div class="event">⚽ <b>'+esc(s.player||s)+'</b> '+(s.minute?esc(s.minute)+"′ ":"")+esc(s.team||"")+(s.assist?' · Assist: '+esc(s.assist):'')+'</div>').join("")||'<p class="muted">—</p>';
   const ev=(x.events||[]).map(e=>'<div class="event"><b>'+(e.game?("#"+esc(e.game)+" · "):"")+esc(e.m||"")+"′</b> '+esc(e.msg||e.type||"")+'</div>').join("");
   app.innerHTML='<div class="ey">BETINSIGHT MATCH LAB · '+new Date(x.created_at).toLocaleString("de-DE")+'</div><h1>'+esc(x.team_a)+' <span class="muted">vs.</span> '+esc(x.team_b)+'</h1><div class="score">'+esc(x.series_a)+' : '+esc(x.series_b)+'</div><p><b>Seriensieger:</b> '+esc(x.winner)+'</p><section class="card"><h2>Einzelspiele</h2><div class="grid">'+games+'</div></section><section class="card"><h2>Torschützen</h2>'+sc+'</section><section class="card"><h2>Spielereignisse</h2>'+ev+'</section>';
 }catch(e){fail(e)}};
 xhr.onerror=()=>fail("Netzwerkfehler");xhr.ontimeout=()=>fail("Zeitüberschreitung");
 function fail(e){console.error(e);app.innerHTML='<h1>Bericht konnte nicht geladen werden.</h1><p class="muted">Bericht-ID: '+esc(slug)+'</p><button onclick="location.reload()">Erneut laden</button>'}
 xhr.send();
})();
</script></body></html>
