<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fd=s=>{try{return new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(s))}catch{return String(s||"").slice(0,10)}};
(async()=>{const pair=new URLSearchParams(location.search).get("pair")||"";const app=document.getElementById("app");if(!pair){app.innerHTML='<section class="hero"><div class="wrap"><h1>Keine Konstellation angegeben.</h1></div></section>';return}

const runs=(x.runs||[]).slice().reverse().map(v=>'<tr><td>'+fd(v.played_at)+'</td><td>'+v.series_length+'</td><td>'+esc(v.winner||'–')+'</td><td>'+v.game_wins_left+':'+v.game_wins_right+' ('+v.game_draws+' Remis)</td><td>'+v.goals_left+':'+v.goals_right+'</td><td><a href="'+esc(v.old_report_url)+'">Originalbericht</a></td></tr>').join("");
app.innerHTML='<section class="hero"><div class="wrap"><div class="ey">BetInsight Football Wiki · Live-Konstellation</div><h1>'+esc(x.team_left)+'<br>vs. '+esc(x.team_right)+'</h1><p class="lead">Alle vollständig gespeicherten Durchgänge dieser Paarung werden automatisch zusammengeführt. Trainerprofile und Community-Clubs sind ausgeschlossen.</p></div></section><section class="section"><div class="wrap"><div class="grid"><div class="stat"><b>'+x.total_series+'</b><span>Serien</span></div><div class="stat"><b>'+x.total_games+'</b><span>Einzelspiele</span></div><div class="stat"><b>'+x.series_wins_left+':'+x.series_wins_right+'</b><span>Seriensiege</span></div><div class="stat"><b>'+x.game_wins_left+':'+x.game_wins_right+'</b><span>Einzelspielsiege · '+x.game_draws+' Remis</span></div><div class="stat"><b>'+x.goals_left+':'+x.goals_right+'</b><span>Gesamttore</span></div><div class="stat"><b>'+fd(x.last_played_at)+'</b><span>letzter Durchgang</span></div></div></div></section><section class="section"><div class="wrap"><h2>Varianten 1 · 3 · 5 · 10 Spiele</h2>'+vars+'</div></section><section class="section"><div class="wrap"><h2>Gespeicherte Durchgänge</h2><div class="tablewrap"><table><thead><tr><th>Datum</th><th>Spiele</th><th>Sieger</th><th>Bilanz</th><th>Tore</th><th>Alter Bericht</th></tr></thead><tbody>'+runs+'</tbody></table></div><div class="actions"><a class="btn primary" href="/de/time-clash/">TIME CLASH spielen</a></div></div></section><section class="section"><div class="wrap"><div class="notice">Dieser Live-Bericht ist sofort nach Abschluss einer neuen realen/historischen Konstellation verfügbar. Die dauerhafte SEO-Seite wird anschließend automatisch in das statische Football Wiki übernommen. Bestehende Detailberichte bleiben erhalten.</div></div></section>';
}catch(e){app.innerHTML='<section class="hero"><div class="wrap"><h1>Diese Wiki-Konstellation ist nicht verfügbar.</h1><p class="lead">Trainer-/Community-Clashes werden bewusst nicht in das Football Wiki aufgenommen.</p></div></section>'}})();
