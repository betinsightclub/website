<body>
  <main class="wrap" id="countdownStage">
    <div class="brandBlock" aria-label="BetInsight Marken">
      <div class="brandCell brand-main"><img src="/webinar/assets/betinsight-club-logo.webp" alt="BetInsight Club"></div>
      <div class="brandSubRow">
        <div class="brandCell brand-time"><img src="/webinar/assets/time-clash-logo.webp" alt="TIME CLASH by BetInsight Club"></div>
        <div class="brandCell brand-network"><img src="/webinar/assets/betinsight-network-logo.webp" alt="BetInsight Network"></div>
      </div>
    </div>
    <section class="panel">
      <div class="live">🔴 LIVE-WEBINAR</div>
      <h1>Wir starten gleich</h1>
      <p class="start" id="startText">Nächster Termin wird geladen …</p>
      <div class="count">
        <div class="box"><span class="num" id="days">00</span><span class="lbl">Tage</span></div>
        <div class="box"><span class="num" id="hours">00</span><span class="lbl">Stunden</span></div>
        <div class="box"><span class="num" id="minutes">00</span><span class="lbl">Minuten</span></div>
        <div class="box"><span class="num" id="seconds">00</span><span class="lbl">Sekunden</span></div>
      </div>
      <div id="status">Wir freuen uns auf dich</div>
      <div class="music"><button id="musicBtn" type="button">▶ Musik starten</button></div>
      <audio id="bgMusic1" preload="metadata" src="/BetInsight%20(7).mp3"></audio>
      <audio id="bgMusic2" preload="metadata">
        <source src="/Time%20Clash(1).mp3" type="audio/mpeg">
        <source src="/BetInsight%20(7).mp3" type="audio/mpeg">
      </audio>
    </section>
  </main>

  <section id="videoStage">
    <video id="trailer" playsinline preload="auto" src="/Trailer%20ohne%20f%C3%BCr%20Webinar%20.mp4"></video>
    <div id="videoMessage">🔴 Das Webinar startet jetzt</div>
    <button class="soundBtn" id="soundBtn" type="button">🔊 Video mit Ton starten</button>
  </section>

<script>
const WEBINAR_TIMEZONE='Europe/Berlin';
const WEBINAR_HOUR=20;

const d=document.getElementById('days'),h=document.getElementById('hours'),m=document.getElementById('minutes'),s=document.getElementById('seconds'),status=document.getElementById('status');
const startText=document.getElementById('startText');
const countdownStage=document.getElementById('countdownStage'),videoStage=document.getElementById('videoStage'),video=document.getElementById('trailer'),soundBtn=document.getElementById('soundBtn');
const audio1=document.getElementById('bgMusic1'),audio2=document.getElementById('bgMusic2'),tracks=[audio1,audio2],btn=document.getElementById('musicBtn');
let switched=false;
let soundAttempted=false;
let webinarStart=0;
let exactStartTimer=null;
let musicActive=false;
let trackIndex=0;
let gapTimer=null;
const MUSIC_GAP=2;
const pad=n=>String(n).padStart(2,'0');
tracks.forEach(t=>t.volume=.38);

function zonedParts(date,timeZone){
  const parts=new Intl.DateTimeFormat('en-GB',{
    timeZone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'
  }).formatToParts(date);
  const out={};
  for(const p of parts){if(p.type!=='literal')out[p.type]=Number(p.value)}
  return out;
}

function epochForZonedTime(year,month,day,hour,minute,second,timeZone){
  const wanted=Date.UTC(year,month-1,day,hour,minute,second);
  let ts=wanted;
  for(let i=0;i<3;i++){
    const p=zonedParts(new Date(ts),timeZone);
    const seen=Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second);
    ts+=wanted-seen;
  }
  return ts;
}

function getWebinarTarget(){
  const now=new Date();
  const p=zonedParts(now,WEBINAR_TIMEZONE);
  const calendarDate=new Date(Date.UTC(p.year,p.month-1,p.day));
  const weekday=calendarDate.getUTCDay(); // Sonntag=0 ... Donnerstag=4
  let daysAhead=(4-weekday+7)%7;

  // Donnerstags bleibt der aktuelle Termin bis Mitternacht aktiv. So startet
  // das Video auch nach einem Reload direkt nach 20:00 Uhr weiterhin korrekt.
  if(weekday===4)daysAhead=0;

  const targetDate=new Date(Date.UTC(p.year,p.month-1,p.day+daysAhead));
  const year=targetDate.getUTCFullYear();
  const month=targetDate.getUTCMonth()+1;
  const day=targetDate.getUTCDate();
  return epochForZonedTime(year,month,day,WEBINAR_HOUR,0,0,WEBINAR_TIMEZONE);
}

function updateStartLabel(){
  const dateText=new Intl.DateTimeFormat('de-DE',{
    timeZone:WEBINAR_TIMEZONE,weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'
  }).format(new Date(webinarStart));
  startText.innerHTML=`Nächster Termin: <strong>${dateText}</strong> · <strong>20:00 Uhr</strong>`;
}

function clearGapTimer(){
  if(gapTimer){clearTimeout(gapTimer);gapTimer=null}
}

function stopMusic(reset=false){
  musicActive=false;
  clearGapTimer();
  tracks.forEach(t=>{
    t.pause();
    if(reset){try{t.currentTime=0}catch(e){}}
  });
  btn.textContent='▶ Musik starten';
}

function pauseMusic(){
  musicActive=false;
  clearGapTimer();
  tracks.forEach(t=>t.pause());
  btn.textContent='▶ Musik starten';
}

function waitForTrackMetadata(track){
  if(Number.isFinite(track.duration)&&track.duration>0)return Promise.resolve(track.duration);
  return new Promise((resolve,reject)=>{
    const done=()=>{
      cleanup();
      Number.isFinite(track.duration)&&track.duration>0?resolve(track.duration):reject(new Error('Audiodauer nicht verfügbar'));
    };
    const fail=()=>{cleanup();reject(new Error('Audiodauer nicht verfügbar'))};
    const cleanup=()=>{
      track.removeEventListener('loadedmetadata',done);
      track.removeEventListener('durationchange',done);
      track.removeEventListener('error',fail);
      clearTimeout(timeout);
    };
    const timeout=setTimeout(fail,7000);
    track.addEventListener('loadedmetadata',done,{once:true});
    track.addEventListener('durationchange',done,{once:true});
    track.addEventListener('error',fail,{once:true});
    track.load();
  });
}

async function getPlaylistDurations(){
  const [d1,d2]=await Promise.all(tracks.map(waitForTrackMetadata));
  return {d1,d2,cycle:d1+MUSIC_GAP+d2+MUSIC_GAP};
}

function playlistPhase(cycle){
  const remaining=Math.max(0,(webinarStart-Date.now())/1000);
  return ((cycle-(remaining%cycle))%cycle+cycle)%cycle;
}

async function syncMusicToWebinar(){
  if(switched)return;
  const remaining=(webinarStart-Date.now())/1000;
  if(remaining<=0){await startTrailer();return}

  btn.disabled=true;
  btn.textContent='⏳ Musik wird synchronisiert …';

  try{
    const {d1,d2,cycle}=await getPlaylistDurations();
    if(!musicActive)return;

    clearGapTimer();
    tracks.forEach(t=>t.pause());

    const phase=playlistPhase(cycle);

    // Zyklus: Lied 1 -> 2s Pause -> Lied 2 -> 2s Pause.
    // Der Einstiegspunkt wird aus der Restzeit bis 20:00 berechnet,
    // damit eine Zyklusgrenze exakt auf den Webinarbeginn fällt.
    if(phase<d1){
      trackIndex=0;
      audio1.currentTime=Math.min(phase,Math.max(0,d1-.02));
      await audio1.play();
    }else if(phase<d1+MUSIC_GAP){
      trackIndex=1;
      const wait=(d1+MUSIC_GAP-phase)*1000;
      gapTimer=setTimeout(()=>{if(musicActive&&!switched)syncMusicToWebinar()},Math.max(0,wait));
    }else if(phase<d1+MUSIC_GAP+d2){
      trackIndex=1;
      const pos=phase-d1-MUSIC_GAP;
      audio2.currentTime=Math.min(pos,Math.max(0,d2-.02));
      await audio2.play();
    }else{
      trackIndex=0;
      const wait=(cycle-phase)*1000;
      gapTimer=setTimeout(()=>{if(musicActive&&!switched)syncMusicToWebinar()},Math.max(0,wait));
    }

    btn.textContent='⏸ Musik pausieren';
  }catch(e){
    musicActive=false;
    btn.textContent='▶ Musik starten';
  }finally{
    btn.disabled=false;
  }
}

tracks.forEach((track,index)=>{
  track.addEventListener('ended',()=>{
    if(!musicActive||switched||index!==trackIndex)return;
    // Bei jedem Titelende neu an der absoluten Webinarzeit ausrichten.
    // So sammelt sich über viele Schleifen kein Timer-Drift an.
    syncMusicToWebinar();
  });
});

async function startMusic(){
  if(switched)return;
  musicActive=true;
  await syncMusicToWebinar();
}

async function ensureTrailerPlaying(){
  if(video.ended || !video.paused)return;
  if(!soundAttempted){
    soundAttempted=true;
    video.muted=false;
    try{await video.play();return;}catch(e){}
  }
  video.muted=true;
  try{
    await video.play();
    soundBtn.style.display='block';
  }catch(e){}
}

async function startTrailer(){
  if(!switched){
    switched=true;
    stopMusic(true);
    countdownStage.style.display='none';
    videoStage.style.display='block';
    video.currentTime=0;
  }
  await ensureTrailerPlaying();
}

function scheduleExactStart(){
  if(exactStartTimer)clearTimeout(exactStartTimer);
  const delay=webinarStart-Date.now();
  if(delay<=0){startTrailer();return}
  exactStartTimer=setTimeout(startTrailer,delay);
}

function tick(){
  let x=webinarStart-Date.now();
  if(x<=0){
    d.textContent=h.textContent=m.textContent=s.textContent='00';
    status.textContent='🔴 Das Webinar läuft jetzt';
    startTrailer();
    return;
  }
  const dd=Math.floor(x/86400000);x%=86400000;const hh=Math.floor(x/3600000);x%=3600000;const mm=Math.floor(x/60000);x%=60000;const ss=Math.floor(x/1000);
  d.textContent=pad(dd);h.textContent=pad(hh);m.textContent=pad(mm);s.textContent=pad(ss);status.textContent=(dd===0&&hh===0&&mm<10)?'🔴 Gleich geht es los':'Wir freuen uns auf dich';
}

webinarStart=getWebinarTarget();
updateStartLabel();
scheduleExactStart();
tick();
setInterval(tick,250);

btn.addEventListener('click',async()=>{
  if(musicActive){
    pauseMusic();
  }else{
    await startMusic();
  }
});

soundBtn.addEventListener('click',async()=>{
  video.muted=false;
  try{await video.play();soundBtn.style.display='none'}catch(e){}
});
</script>
