<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galería TIME CLASH – BetInsight</title><style>
:root{--bg:#020b12;--panel:#071a26;--line:#1e4a61;--text:#eef8ff;--muted:#8ea9b8;--gold:#f5c54d;--cyan:#6ed7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#0b2a3d,#020b12 45%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}.wrap{width:min(1180px,94vw);margin:auto}header{border-bottom:1px solid #163d51;background:#03131d}.nav{min-height:66px;display:flex;align-items:center;justify-content:space-between}.nav img{height:46px}.nav a{color:#d9edf7;text-decoration:none;font-weight:900}.hero{padding:34px 0 20px}.hero h1{margin:5px 0;font-size:clamp(32px,5vw,56px)}.hero p{color:var(--muted);margin:0}.ey{color:var(--gold);font-size:11px;letter-spacing:.15em;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding-bottom:44px}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#071b28,#03131d);overflow:hidden}.visual{aspect-ratio:16/9;background:#06141d}.visual svg{width:100%;height:100%;display:block}.body{padding:13px}.body h3{margin:0 0 5px;font-size:17px}.meta{color:var(--muted);font-size:11px}.body a{display:inline-block;margin-top:10px;color:#09151b;background:var(--gold);padding:8px 11px;border-radius:9px;text-decoration:none;font-weight:900;font-size:12px}.empty{border:1px dashed #2a5368;border-radius:16px;padding:30px;text-align:center;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.nav img{height:38px}}
</style></head><body><header><div class="wrap nav"><img src="https://raw.githubusercontent.com/betinsightclub/profil/main/logo_betisight.club.png" alt="BetInsight"><a href="/es/time-clash/">← Volver a TIME CLASH</a></div></header><main class="wrap"><section class="hero"><div class="ey">BETINSIGHT MATCH LAB</div><h1>Galería TIME CLASH</h1><p>Imágenes de periódico publicadas y momentos de la comunidad TIME CLASH.</p></section><div id="grid" class="grid"><div class="empty">Aún no hay imágenes publicadas.</div></div></main><script>
const API="https://lszlaglwlixejzytrurg.supabase.co/functions/v1/time-clash-media";
const esc=v=>String(v||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function figure(a,name){let body=a.build==="slim"?.82:a.build==="stocky"?1.2:a.build==="strong"?1.1:1,w=78*body,skin=a.skin||"#d7a17e",hair=a.hairColor||"#3a2418",hairPath=a.hairLength==="bald"?"":a.hairLength==="long"?'<path d="M70 35 Q90 8 110 35 L108 82 Q91 66 72 82Z" fill="'+hair+'"/>':a.hairLength==="medium"?'<path d="M71 36 Q90 14 109 36 L106 58 Q90 49 74 58Z" fill="'+hair+'"/>':'<path d="M73 37 Q90 22 107 37 L105 50 Q90 44 75 50Z" fill="'+hair+'"/>';let curls=(a.hairTexture==="curly"||a.hairTexture==="coily")?'<g fill="'+hair+'"><circle cx="75" cy="34" r="6"/><circle cx="84" cy="29" r="6"/><circle cx="93" cy="28" r="6"/><circle cx="102" cy="31" r="6"/><circle cx="108" cy="37" r="6"/></g>':"";let shirt='<rect x="'+(90-w/2)+'" y="91" width="'+w+'" height="82" rx="18" fill="'+(a.kit1||"#25a9ff")+'"/>';if(a.kitStyle==="stripe")shirt+='<rect x="84" y="91" width="12" height="82" fill="'+(a.kit2||"#f7c64e")+'"/>';return '<g transform="translate(720 120) scale(1.45)"><circle cx="90" cy="57" r="30" fill="'+skin+'"/>'+hairPath+curls+shirt+'<text x="90" y="143" text-anchor="middle" fill="#fff" stroke="#000" stroke-width=".6" paint-order="stroke" font-size="24" font-weight="1000">'+esc(a.shirtNo||"")+'</text><path d="M55 164 L77 288 L64 288 L70 160Z" fill="#112a39"/><path d="M125 164 L103 288 L116 288 L110 160Z" fill="#112a39"/></g>'}
function art(m){let r=Array.isArray(m.time_clashes)?m.time_clashes[0]:m.time_clashes||{},a=m.avatar_snapshot||{},headline=String(m.player_name||"").toUpperCase(),ball=String(m.scene_variant||"").includes("header")?'<circle cx="905" cy="105" r="22" fill="#fff" stroke="#111" stroke-width="4"/>':String(m.scene_type||"").startsWith("target")?'<circle cx="995" cy="300" r="22" fill="#fff" stroke="#111" stroke-width="4"/>':'<circle cx="945" cy="440" r="21" fill="#fff" stroke="#111" stroke-width="4"/>';return '<svg viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0d2737"/><rect x="40" y="40" width="1120" height="595" rx="28" fill="#061722" stroke="#315d72" stroke-width="2"/><text x="72" y="102" fill="#6ed7ff" font-size="23" font-family="Arial" font-weight="900">BETINSIGHT · TIME CLASH</text><text x="72" y="178" fill="#f5c54d" font-size="19" font-family="Arial">GAME '+m.scene_game+' · '+m.scene_minute+'&#39;</text><text x="72" y="245" fill="#fff" font-size="46" font-family="Arial" font-weight="900">'+esc(headline)+'</text><text x="72" y="302" fill="#c7dce7" font-size="25" font-family="Arial">'+esc(r.team_a||"")+' '+(r.series_a??"")+' : '+(r.series_b??"")+' '+esc(r.team_b||"")+'</text><text x="72" y="560" fill="#8ea9b8" font-size="18" font-family="Arial">Escena: '+esc(m.scene_variant||m.scene_type)+'</text>'+figure(a,m.player_name)+ball+'</svg>'}
(async()=>{try{let r=await fetch(API+"?gallery=1",{cache:"no-store"}),d=await r.json(),items=(d.items||[]).filter(x=>{let c=Array.isArray(x.time_clashes)?x.time_clashes[0]:x.time_clashes;return !c?.language||c.language==="es"}),grid=document.getElementById("grid");if(!items.length)return;grid.innerHTML="";items.forEach(m=>{let c=Array.isArray(m.time_clashes)?m.time_clashes[0]:m.time_clashes||{},el=document.createElement("article");el.className="card";el.innerHTML='<div class="visual">'+art(m)+'</div><div class="body"><h3>'+esc(m.title||m.player_name)+'</h3><div class="meta">'+esc(c.team_a||"")+' – '+esc(c.team_b||"")+' · '+new Date(m.published_at).toLocaleDateString()+'</div><a href="/es/time-clash/bericht/?clash='+encodeURIComponent(c.public_slug||"")+'">Abrir informe</a></div>';grid.appendChild(el)})}catch(e){}})();
</script></body></html>
