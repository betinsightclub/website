<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031720"><title>TIME CLASH – Match Report | BetInsight</title><style>:root{--bg:#020d14;--panel:#061b28;--line:#17445e;--cyan:#74d9ff;--gold:#f7c64e;--green:#3ce5a5;--muted:#9eb5c3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#123b56,#061925 34%,var(--bg) 72%);color:#f5fbff;font-family:Inter,system-ui,sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:28px 0 70px}a{color:var(--cyan)}.hero,.card{border:1px solid var(--line);background:linear-gradient(155deg,#092536ee,#04131dee);border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 20px 60px #0006}.ey{color:var(--gold);font-weight:900;letter-spacing:.13em;font-size:12px}.hero h1{margin:8px 0}.score{font-size:clamp(34px,7vw,68px);font-weight:1000;color:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.game,.event{border:1px solid #153f56;border-radius:13px;padding:13px;background:#03151f}.event{margin:7px 0}.muted{color:var(--muted)}h2{color:var(--cyan)}</style></head><body><main class="wrap"><a href="/en/time-clash/">← Back to TIME CLASH</a><section id="app" class="hero"><div class="ey">BETINSIGHT MATCH LAB</div><h1>TIME CLASH – Match Report</h1><p>Loading report…</p></section></main><script>const API="https://lszlaglwlixejzytrurg.supabase.co/functions/v1/time-clash-report",q=new URLSearchParams(location.search),slug=q.get("clash"),app=document.getElementById("app");const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));fetch(API+"?slug="+encodeURIComponent(slug||"")).then(r=>r.json()).then(d=>{let x=d.report;if(!x)throw 0;let games=(x.games||[]).map((g,i)=>'<div class="game"><b>'+esc("Matches "+(i+1))+'</b><div>'+esc(x.team_a)+' '+Number(g.ga||0)+' : '+Number(g.gb||0)+' '+esc(x.team_b)+'</div><small class="muted">'+esc(g.venue||"")+'</small></div>').join("");let sc=(x.scorers||[]).map(s=>'<div class="event">⚽ <b>'+esc(s.player||s)+'</b> '+(s.minute?esc(s.minute)+"′ ":"")+esc(s.team||"")+(s.assist?' · Assist: '+esc(s.assist):'')+'</div>').join("")||'<p class="muted">—</p>';let ev=(x.events||[]).map(e=>'<div class="event"><b>'+esc(e.game?("#"+e.game+" · "):"")+esc(e.m||"")+"′</b> '+esc(e.msg||e.type||"")+'</div>').join("");app.innerHTML='<div class="ey">BETINSIGHT MATCH LAB · '+new Date(x.created_at).toLocaleString("en")+'</div><h1>'+esc(x.team_a)+' <span class="muted">vs.</span> '+esc(x.team_b)+'</h1><div class="score">'+esc(x.series_a)+' : '+esc(x.series_b)+'</div><p><b>Series result:</b> '+esc(x.winner)+'</p><section class="card"><h2>Matches</h2><div class="grid">'+games+'</div></section><section class="card"><h2>Goalscorers</h2>'+sc+'</section><section class="card"><h2>Match events</h2>'+ev+'</section>'}).catch(()=>app.innerHTML='<h1>Report not found.</h1>');</script></body></html>
