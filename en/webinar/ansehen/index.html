  <style>
    :root{--bg:#031720;--bg2:#020f16;--panel:#072432;--text:#f5fbff;--muted:#aac0cc;--line:rgba(126,211,255,.18);--blue:#1687ff;--green:#00d99b;--shadow:0 24px 70px rgba(0,0,0,.36)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 82% 8%,rgba(22,135,255,.16),transparent 30rem),radial-gradient(circle at 12% 84%,rgba(0,217,155,.08),transparent 28rem),linear-gradient(180deg,var(--bg2),var(--bg));line-height:1.55}.wrap{width:min(calc(100% - 32px),1080px);margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 0}.logo{width:190px}.back{padding:10px 15px;border:1px solid var(--line);border-radius:12px;color:#d8e9f1;text-decoration:none;background:rgba(255,255,255,.04);font-size:14px;font-weight:800}.main{padding:24px 0 70px}.card{padding:clamp(24px,4vw,42px);border:1px solid rgba(22,135,255,.3);border-radius:26px;background:linear-gradient(160deg,rgba(10,43,59,.98),rgba(5,28,39,.98));box-shadow:var(--shadow)}h1{margin:0 0 10px;font-size:clamp(34px,5vw,54px);line-height:1.05}.lead{margin:0 0 26px;color:var(--muted);font-size:18px}.video{position:relative;overflow:hidden;width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:18px;background:#020b10}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.notice{padding:20px;border:1px solid rgba(0,217,155,.28);border-radius:16px;background:rgba(0,217,155,.07);color:#d9fff2}.notice a{color:#fff}.after-video{margin-top:24px;padding:24px;border:1px solid rgba(0,217,155,.28);border-radius:18px;background:linear-gradient(145deg,rgba(0,217,155,.08),rgba(22,135,255,.06));text-align:center}.after-video .kicker{display:inline-flex;margin-bottom:10px;color:#8ff0cf;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.after-video h2{margin:0 0 9px;font-size:clamp(24px,3vw,34px);line-height:1.15}.after-video p{max-width:720px;margin:0 auto;color:var(--muted)}.after-video-actions{display:flex;justify-content:center;gap:11px;flex-wrap:wrap;margin-top:20px}.after-video-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:12px 18px;border-radius:13px;color:#fff;text-decoration:none;font-weight:900}.after-video-actions .register{background:linear-gradient(135deg,#00c792,#008e69);box-shadow:0 12px 28px rgba(0,217,155,.16)}.after-video-actions .founder{border:1px solid rgba(126,211,255,.24);background:rgba(22,135,255,.12)}.after-video-note{margin-top:11px!important;color:#829aa7!important;font-size:12px}.cta{display:inline-flex;margin-top:20px;padding:13px 18px;border-radius:13px;background:linear-gradient(135deg,#1687ff,#0a69d8);color:#fff;text-decoration:none;font-weight:900}footer{padding:24px 0 34px;color:#78909c;font-size:13px;text-align:center}@media(max-width:620px){.after-video-actions{display:grid}.after-video-actions a{width:100%}}

<body>
  <div class="wrap"><header class="topbar"><a href="../" data-preserve-ref><img class="logo" src="../../../assets/betinsight-logo.png" alt="BetInsight.club"></a><a class="back" href="../" data-preserve-ref>← Webinar selection</a></header></div>
  <main class="main"><div class="wrap"><section class="card">
    <h1>BetInsight Webinar Replay</h1>
    <p class="lead">Watch the webinar at your own pace.</p>
    <div id="content"><div class="notice">Checking replay …</div></div>
  </section></div></main>
  <footer>© 2026 BetInsight Club · Webinar</footer>
  <script>
  (async function(){
    const KEY='betinsight_ref_code',DEFAULT='POOL',ACCESS='betinsight_replay_access';
    const clean=v=>{if(!v)return'';v=String(v).trim();return /^[A-Za-z0-9_-]{2,50}$/.test(v)?v:''};
    const params=new URLSearchParams(location.search),fromUrl=clean(params.get('ref')||params.get('ref_code'));
    if(fromUrl&&fromUrl!==DEFAULT){try{localStorage.setItem(KEY,fromUrl)}catch(e){};document.cookie='betinsight_ref_code='+encodeURIComponent(fromUrl)+';path=/;max-age=7776000;SameSite=Lax'}
    let stored='';try{stored=clean(localStorage.getItem(KEY))}catch(e){};let cookie='';document.cookie.split(';').forEach(p=>{const [k,...r]=p.trim().split('=');if(k==='betinsight_ref_code')cookie=clean(decodeURIComponent(r.join('='))) });
    const activeRef=fromUrl||stored||cookie||DEFAULT;
    const withRef=base=>{const u=new URL(base,location.href);u.searchParams.set('ref',activeRef);return u.toString()};
    document.querySelectorAll('[data-preserve-ref]').forEach(a=>{try{const u=new URL(a.href,location.href);if(activeRef!==DEFAULT)u.searchParams.set('ref',activeRef);a.href=u.toString()}catch(e){}});
    let allowed=false;try{allowed=sessionStorage.getItem(ACCESS)==='1'}catch(e){}
    if(!allowed){const u=new URL('../aufzeichnung/',location.href);if(activeRef!==DEFAULT)u.searchParams.set('ref',activeRef);location.replace(u.toString());return}
    const content=document.getElementById('content');
    try{
      const res=await fetch('/de/webinar/replay-config.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('config');const cfg=await res.json();
      if(!cfg.available||!cfg.video_embed_url){content.innerHTML='<div class="notice"><strong>The replay has not been released yet.</strong><br>You will be informed as soon as it is available.</div>';return}
      const url=String(cfg.video_embed_url||'');
      if(!/^https:\/\//i.test(url))throw new Error('url');
      content.innerHTML='<div class="video"><iframe src="'+url.replace(/"/g,'&quot;')+'" title="BetInsight Webinar Replay" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><section class="after-video" aria-labelledby="afterVideoTitle"><span class="kicker">Your next step</span><h2 id="afterVideoTitle">Would you like to try BetInsight yourself now?</h2><p>Create your free BetInsight access and receive 5 starter units. Your personal referral code is preserved automatically.</p><div class="after-video-actions"><a id="registerAfterReplay" class="register" href="#">Create free access</a><a id="founderAfterReplay" class="founder" href="#">Still have questions? Founder call</a></div><p class="after-video-note">Webinar registration and free BetInsight registration remain separate.</p></section>';
      document.getElementById('registerAfterReplay').href=withRef('https://betinsight.club/ref/');
      document.getElementById('founderAfterReplay').href=withRef('https://betinsight.club/en/termin/');
    }catch(e){content.innerHTML='<div class="notice">The replay could not be loaded right now. Please try again later.</div>'}
  })();
  </script>
