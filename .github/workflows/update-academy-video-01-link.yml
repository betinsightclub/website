name: Academy 01 YouTube-Link aktualisieren

on:
  push:
    paths:
      - '.github/workflows/update-academy-video-01-link.yml'

permissions:
  contents: write

jobs:
  patch-academy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: YouTube-Link ersetzen
        shell: python
        run: |
          from pathlib import Path

          path = Path('de/academy/index.html')
          text = path.read_text(encoding='utf-8')
          old = 'TthBEfLi1ZA'
          new = '6rospCOUZRY'
          if old not in text:
              raise SystemExit('Alter Academy-Video-Link nicht gefunden')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/update-academy-video-01-link.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Änderungen committen
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add de/academy/index.html .github/workflows/update-academy-video-01-link.yml
          git commit -m "Academy 01: YouTube-Link aktualisieren"
          git push
