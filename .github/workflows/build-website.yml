name: BetInsight Website prüfen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Website laden
        uses: actions/checkout@v6

      - name: BetInsight Website-Struktur prüfen
        shell: bash
        run: |
          set -euo pipefail

          echo "BetInsight Website-Prüfung startet"

          REQUIRED_FILES=(
            "index.html"
            "de/index.html"
            "de/rechner/index.html"
            "favicon.ico"
            "lang/de.json"
            "lang/en.json"
            "lang/es.json"
            "lang/pt-BR.json"
            "lang/it.json"
            "lang/fr.json"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "FEHLER: Pflichtdatei fehlt: $FILE"
              exit 1
            fi
          done

          if [ ! -d "assets" ]; then
            echo "FEHLER: assets-Ordner fehlt."
            exit 1
          fi

          # Alte Rechner-Verlinkung darf in der neuen öffentlichen Website
          # nicht mehr verwendet werden.
          if grep -R \
            --include="*.html" \
            --exclude-dir=".git" \
            -n \
            "betinsightclub.github.io/profil/rechner" .; then
            echo "FEHLER: Alter GitHub-Rechnerlink gefunden."
            exit 1
          fi

          # Altes absolutes Profil-Favicon darf ebenfalls nicht mehr
          # in der neuen öffentlichen Website verwendet werden.
          if grep -R \
            --include="*.html" \
            --exclude-dir=".git" \
            -n \
            'href="/profil/favicon.ico"' .; then
            echo "FEHLER: Alter Favicon-Pfad gefunden."
            exit 1
          fi

          echo "OK: BetInsight Website-Struktur ist vollständig."
