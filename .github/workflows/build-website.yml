name: BetInsight Website aufbauen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Neues Website-Repository laden
        uses: actions/checkout@v4
        with:
          path: target

      - name: Bestehendes BetInsight-Repository laden
        uses: actions/checkout@v4
        with:
          repository: betinsightclub/profil
          path: source

      - name: Öffentliche Website aufbauen
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${GITHUB_WORKSPACE}/target"
          SOURCE="${GITHUB_WORKSPACE}/source"

          cd "$TARGET"

          echo "BetInsight Website-Migration startet"

          # Nur die neue öffentliche Struktur neu erzeugen.
          # README und .github bleiben erhalten.
          rm -rf de en es pt-br it fr assets lang
          rm -f index.html favicon.ico .nojekyll

          mkdir -p de/rechner
          mkdir -p assets
          mkdir -p lang
          mkdir -p en es pt-br it fr

          # Bestehende gute Landingpage übernehmen
          cp "$SOURCE/betinsightcommunity/index.html" de/index.html

          # Alle Bilder / Assets der Landingpage übernehmen
          cp -R "$SOURCE/betinsightcommunity/assets/." assets/

          # Bestehenden Kundenrechner übernehmen
          cp "$SOURCE/rechner/index.html" de/rechner/index.html

          # Favicon übernehmen
          cp "$SOURCE/favicon.ico" favicon.ico

          # GitHub Pages ohne Jekyll
          touch .nojekyll

          # Pfade der Landingpage an die neue Website-Struktur anpassen
          python3 <<'PY'
          from pathlib import Path

          landing = Path("de/index.html")
          text = landing.read_text(encoding="utf-8")

          # Favicon lokal statt alte github.io-Adresse
          text = text.replace(
              'href="https://betinsightclub.github.io/profil/favicon.ico"',
              'href="../favicon.ico"'
          )

          # Rechner künftig innerhalb der neuen öffentlichen Website
          text = text.replace(
              'href="https://betinsightclub.github.io/profil/rechner/"',
              'href="rechner/"'
          )

          # Assets liegen eine Ebene oberhalb von /de/
          text = text.replace('src="assets/', 'src="../assets/')
          text = text.replace('href="assets/', 'href="../assets/')
          text = text.replace('url("assets/', 'url("../assets/')
          text = text.replace("url('assets/", "url('../assets/")

          landing.write_text(text, encoding="utf-8")

          calculator = Path("de/rechner/index.html")
          text = calculator.read_text(encoding="utf-8")

          # Favicon und Logo an neue Struktur anpassen
          text = text.replace(
              'href="/profil/favicon.ico"',
              'href="../../favicon.ico"'
          )

          text = text.replace(
              'src="../logo_betisight.club.png"',
              'src="../../assets/betinsight-logo.png"'
          )

          calculator.write_text(text, encoding="utf-8")
          PY

          # Domain-Stamm:
          # Besucher werden zunächst auf die deutsche Masterversion geleitet.
          # Referral-Code und andere URL-Parameter bleiben erhalten.
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex">
            <title>BetInsight.club</title>
            <script>
              (function () {
                const target =
                  "./de/" +
                  window.location.search +
                  window.location.hash;

                window.location.replace(target);
              })();
            </script>
          </head>
          <body>
            <p>
              Weiterleitung zu
              <a id="fallback" href="./de/">BetInsight.club</a>
            </p>

            <script>
              document.getElementById("fallback").href =
                "./de/" +
                window.location.search +
                window.location.hash;
            </script>
          </body>
          </html>
          HTML

          # Spracharchitektur bereits vorbereiten.
          cat > lang/de.json <<'JSON'
          {
            "code": "de",
            "locale": "de-DE",
            "name": "Deutsch",
            "status": "master"
          }
          JSON

          cat > lang/en.json <<'JSON'
          {
            "code": "en",
            "locale": "en",
            "name": "English",
            "status": "planned"
          }
          JSON

          cat > lang/es.json <<'JSON'
          {
            "code": "es",
            "locale": "es",
            "name": "Español",
            "status": "planned"
          }
          JSON

          cat > lang/pt-BR.json <<'JSON'
          {
            "code": "pt-BR",
            "locale": "pt-BR",
            "name": "Português (Brasil)",
            "status": "planned"
          }
          JSON

          cat > lang/it.json <<'JSON'
          {
            "code": "it",
            "locale": "it",
            "name": "Italiano",
            "status": "planned"
          }
          JSON

          cat > lang/fr.json <<'JSON'
          {
            "code": "fr",
            "locale": "fr",
            "name": "Français",
            "status": "planned"
          }
          JSON

          # Platzhalter sorgen dafür, dass die Sprachordner bereits
          # Bestandteil der Repository-Struktur sind.
          touch en/.gitkeep
          touch es/.gitkeep
          touch pt-br/.gitkeep
          touch it/.gitkeep
          touch fr/.gitkeep

          echo "Neue Struktur:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Neue Website-Struktur speichern
        working-directory: target
        shell: bash
        run: |
          git config user.name "BetInsight Website Builder"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Keine Änderungen notwendig."
          else
            git commit -m "Öffentliche BetInsight Website initial aufbauen"
            git push
          fi
