name: BetInsight DE Rechtliches verlinken

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Website laden
        uses: actions/checkout@v6

      - name: Python-Datei prüfen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path(".github/scripts/update_de_rechtliches.py")
          if not path.exists():
              raise SystemExit("FEHLER: update_de_rechtliches.py fehlt.")

          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print("OK: Python-Syntax ist gültig.")
          PY

      - name: Rechtliches verlinken
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/update_de_rechtliches.py

      - name: Änderungen kontrollieren
        shell: bash
        run: |
          set -euo pipefail

          test -f de/impressum/index.html
          test -f de/datenschutz/index.html
          test -f de/agb/index.html

          git diff --check

          echo "Geänderte Dateien:"
          git status --short --untracked-files=all

          while read -r FILE
          do
            [ -z "$FILE" ] && continue

            if [ "$FILE" != "de/index.html" ]; then
              echo "FEHLER: Unerwartete Datei verändert: $FILE"
              exit 1
            fi
          done < <(
            git status --short --untracked-files=all |
            awk '{print $2}'
          )

          grep -q 'href="./agb/"' de/index.html
          grep -q 'href="./datenschutz/"' de/index.html
          grep -q 'href="./impressum/"' de/index.html

          if grep -q 'https://betinsight.systeme.io/agbs' de/index.html; then
            echo "FEHLER: Alter AGB-Link noch vorhanden."
            exit 1
          fi

          if grep -q 'https://betinsight.systeme.io/datenschutz' de/index.html; then
            echo "FEHLER: Alter Datenschutz-Link noch vorhanden."
            exit 1
          fi

          echo "OK: Deutsche Rechtstexte sind lokal verlinkt."

      - name: Änderungen speichern
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "BetInsight Website Builder"
          git config user.email "actions@github.com"

          git add de/index.html

          if git diff --cached --quiet; then
            echo "Keine Änderung notwendig."
          else
            git commit -m "Website: deutsche Rechtstexte lokal verlinken"
            git push
          fi
