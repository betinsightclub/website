name: Export original logo reference

on:
  push:
    paths:
      - '.github/workflows/export-original-logo.yml'
      - '.github/scripts/export_original_logo.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - run: python .github/scripts/export_original_logo.py
      - name: Commit original reference
        run: |
          git config user.name 'BetInsight Brand Assets'
          git config user.email 'actions@github.com'
          git add docs/official_logo_small.base64.txt
          if ! git diff --cached --quiet; then
            git commit -m 'brand: export original logo reference for exact compositor'
            git push
          fi
