name: BetInsight Social Preview Pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/social_preview_pilot.py'
      - '.github/workflows/social-preview-pilot.yml'

permissions:
  contents: write

concurrency:
  group: betinsight-social-preview-pilot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Render approved-brand pilot preview and report pages
        run: python .github/scripts/social_preview_pilot.py
      - name: Verify output
        run: |
          set -euo pipefail
          test -s assets/og/flipboard-crystal-palace-man-city-2026-10-09-v3.jpg
          test -s en/ads/flipboard-crystal-palace-man-city-2026-10-09/index.html
          test -s de/anzeigen/flipboard-crystal-palace-man-city-2026-10-09/index.html
          grep -q 'og:image' en/tipps/crystal-palace-man-city-28-08-2026/index.html
          git diff --check
      - name: Commit generated preview and bilingual reports
        run: |
          git config user.name 'BetInsight Social Preview'
          git config user.email 'actions@github.com'
          git add assets/og/flipboard-crystal-palace-man-city-2026-10-09-v3.jpg en/ads/flipboard-crystal-palace-man-city-2026-10-09/index.html de/anzeigen/flipboard-crystal-palace-man-city-2026-10-09/index.html en/tipps/crystal-palace-man-city-28-08-2026/index.html
          if git diff --cached --quiet; then
            echo 'Pilot already up to date'
          else
            git commit -m 'social: publish Flipboard match review with unique approved-logo preview'
            git push
          fi
