name: BetInsight Sprachseiten-Qualität

on:
  pull_request:
    paths:
      - "index.html"
      - "de/index.html"
      - "en/index.html"
      - "es/index.html"
      - "pt/index.html"
      - "it/index.html"
      - "fr/index.html"
      - "scripts/check-language-pages.mjs"
      - ".github/workflows/language-pages-qa.yml"

permissions:
  contents: read

jobs:
  language-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-language-pages.mjs
