name: BetInsight DE EN Sprachsteuerung

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Website laden
        uses: actions/checkout@v6

      - name: Sprachsteuerung einbauen
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path("index.html")
          DE = Path("de/index.html")
          EN = Path("en/index.html")

          for path in (ROOT, DE, EN):
              if not path.exists():
                  sys.exit(f"FEHLER: Pflichtdatei fehlt: {path}")

          def replace_once(text, old, new, label):
              count = text.count(old)

              if count != 1:
                  sys.exit(
                      f"FEHLER: Einfügepunkt {label} "
                      f"wurde {count}x gefunden."
                  )

              return text.replace(old, new, 1)

          # -------------------------------------------------
          # ROOT: automatische Spracherkennung
          # -------------------------------------------------

          root_lines = [
              "<!doctype html>",
              '<html lang="de">',
              "<head>",
              '  <meta charset="utf-8">',
              '  <meta name="viewport" content="width=device-width, initial-scale=1">',
              '  <meta name="robots" content="noindex">',
              "  <title>BetInsight.club</title>",
              "  <script>",
              "    (function () {",
              '      const LANGUAGE_KEY = "betinsight_language";',
              '      const SUPPORTED = ["de", "en"];',
              "",
              "      function cleanLanguage(value) {",
              '        const lang = String(value || "")',
              '          .toLowerCase()',
              '          .split("-")[0];',
              "",
              "        return SUPPORTED.includes(lang)",
              '          ? lang',
              '          : "";',
              "      }",
              "",
              "      function getSavedLanguage() {",
              "        try {",
              "          return cleanLanguage(",
              "            localStorage.getItem(LANGUAGE_KEY)",
              "          );",
              "        } catch (error) {",
              '          return "";',
              "        }",
              "      }",
              "",
              "      function getBrowserLanguage() {",
              "        const languages =",
              "          Array.isArray(navigator.languages)",
              "            ? navigator.languages",
              "            : [navigator.language];",
              "",
              "        for (const language of languages) {",
              "          const cleaned = cleanLanguage(language);",
              "",
              "          if (cleaned) {",
              "            return cleaned;",
              "          }",
              "        }",
              "",
              '        return "de";',
              "      }",
              "",
              "      const params =",
              "        new URLSearchParams(window.location.search);",
              "",
              "      const requestedLanguage =",
              '        cleanLanguage(params.get("lang"));',
              "",
              "      const targetLanguage =",
              "        requestedLanguage ||",
              "        getSavedLanguage() ||",
              "        getBrowserLanguage() ||",
              '        "de";',
              "",
              "      if (requestedLanguage) {",
              "        try {",
              "          localStorage.setItem(",
              "            LANGUAGE_KEY,",
              "            requestedLanguage",
              "          );",
              "        } catch (error) {}",
              "",
              '        params.delete("lang");',
              "      }",
              "",
              "      const query = params.toString();",
              "",
              "      const target =",
              '        "./" + targetLanguage + "/" +',
              '        (query ? "?" + query : "") +',
              "        window.location.hash;",
              "",
              "      window.location.replace(target);",
              "    })();",
              "  </script>",
              "</head>",
              "",
              "<body>",
              "  <p>",
              "    Weiterleitung zu BetInsight …",
              '    <a id="fallbackDe" href="./de/">Deutsch</a>',
              "    ·",
              '    <a id="fallbackEn" href="./en/">English</a>',
              "  </p>",
              "",
              "  <script>",
              "    (function () {",
              "      const params =",
              "        new URLSearchParams(window.location.search);",
              "",
              '      params.delete("lang");',
              "",
              "      const query = params.toString();",
              "",
              "      const suffix =",
              '        (query ? "?" + query : "") +',
              "        window.location.hash;",
              "",
              "      document.getElementById(",
              '        "fallbackDe"',
              '      ).href = "./de/" + suffix;',
              "",
              "      document.getElementById(",
              '        "fallbackEn"',
              '      ).href = "./en/" + suffix;',
              "    })();",
              "  </script>",
              "</body>",
              "</html>",
              "",
          ]

          ROOT.write_text(
              "\n".join(root_lines),
              encoding="utf-8"
          )

          # -------------------------------------------------
          # CSS Sprachschalter
          # -------------------------------------------------

          language_css = "\n".join([
              "    .language-switch{",
              "      display:inline-flex;",
              "      align-items:center;",
              "      gap:3px;",
              "      padding:4px;",
              "      border:1px solid rgba(255,255,255,.12);",
              "      border-radius:999px;",
              "      background:rgba(255,255,255,.035);",
              "    }",
              "",
              "    .language-switch a{",
              "      display:inline-flex;",
              "      align-items:center;",
              "      justify-content:center;",
              "      min-width:38px;",
              "      min-height:34px;",
              "      padding:7px 9px;",
              "      border-radius:999px;",
              "      color:#b8ccd6;",
              "      text-decoration:none;",
              "      font-size:12px;",
              "      font-weight:900;",
              "      letter-spacing:.04em;",
              "      line-height:1;",
              "      transition:.18s ease;",
              "    }",
              "",
              "    .language-switch a:hover,",
              "    .language-switch a:focus-visible{",
              "      color:#fff;",
              "      background:rgba(105,184,255,.11);",
              "      outline:none;",
              "    }",
              "",
              '    .language-switch a[aria-current="page"]{',
              "      color:#fff;",
              "      background:linear-gradient(",
              "        135deg,",
              "        var(--blue),",
              "        var(--blue-2)",
              "      );",
              "      box-shadow:",
              "        0 7px 18px rgba(22,135,255,.22);",
              "    }",
              "",
          ]) + "\n"

          pages = [
              (DE, "de"),
              (EN, "en"),
          ]

          for path, current_language in pages:
              text = path.read_text(encoding="utf-8")

              # ---------------------------------------------
              # Sprachschalter nur einmal einbauen
              # ---------------------------------------------

              if "data-language-switch" not in text:
                  text = replace_once(
                      text,
                      "    .menu-button{",
                      language_css + "    .menu-button{",
                      f"{path} CSS"
                  )

                  if current_language == "de":
                      de_current = ' aria-current="page"'
                      en_current = ""
                  else:
                      de_current = ""
                      en_current = ' aria-current="page"'

                  switch_lines = [
                      '        <div class="nav-actions">',
                      '          <div',
                      '            class="language-switch"',
                      '            data-language-switch',
                      '            aria-label="Language / Sprache"',
                      "          >",
                      '            <a',
                      '              href="../de/"',
                      '              data-language-link',
                      '              data-lang="de"' +
                      de_current,
                      "            >DE</a>",
                      "",
                      '            <a',
                      '              href="../en/"',
                      '              data-language-link',
                      '              data-lang="en"' +
                      en_current,
                      "            >EN</a>",
                      "          </div>",
                  ]

                  text = replace_once(
                      text,
                      '        <div class="nav-actions">',
                      "\n".join(switch_lines),
                      f"{path} Navigation"
                  )

              # ---------------------------------------------
              # Sprachwahl + Referral-Code
              # ---------------------------------------------

              language_marker = (
                  '    const LANGUAGE_STORAGE_KEY = '
                  '"betinsight_language";'
              )

              if language_marker not in text:
                  js_marker = (
                      "    const activeReferralCode = "
                      "getActiveReferralCode();"
                  )

                  language_js = "\n".join([
                      "",
                      '    const LANGUAGE_STORAGE_KEY = "betinsight_language";',
                      "",
                      "    function saveLanguagePreference(language){",
                      '      if(language !== "de" && language !== "en"){',
                      "        return;",
                      "      }",
                      "",
                      "      try{",
                      "        localStorage.setItem(",
                      "          LANGUAGE_STORAGE_KEY,",
                      "          language",
                      "        );",
                      "      }catch(e){}",
                      "    }",
                      "",
                      "    document",
                      "      .querySelectorAll('[data-language-link]')",
                      "      .forEach(link => {",
                      "        try{",
                      "          const target = new URL(",
                      "            link.href,",
                      "            window.location.href",
                      "          );",
                      "",
                      "          if(",
                      "            activeReferralCode !==",
                      "            DEFAULT_REF_CODE",
                      "          ){",
                      "            target.searchParams.set(",
                      "              'ref',",
                      "              activeReferralCode",
                      "            );",
                      "          }else{",
                      "            target.searchParams.delete('ref');",
                      "            target.searchParams.delete(",
                      "              'ref_code'",
                      "            );",
                      "          }",
                      "",
                      "          link.href = target.toString();",
                      "",
                      "          link.addEventListener(",
                      "            'click',",
                      "            () => {",
                      "              saveLanguagePreference(",
                      "                link.dataset.lang",
                      "              );",
                      "            }",
                      "          );",
                      "        }catch(e){}",
                      "      });",
                  ])

                  text = replace_once(
                      text,
                      js_marker,
                      js_marker + language_js,
                      f"{path} JavaScript"
                  )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

          # -------------------------------------------------
          # Sicherheitsprüfung
          # -------------------------------------------------

          root_check = ROOT.read_text(encoding="utf-8")
          de_check = DE.read_text(encoding="utf-8")
          en_check = EN.read_text(encoding="utf-8")

          if (
              '"./" + targetLanguage + "/" +'
              not in root_check
          ):
              sys.exit(
                  "FEHLER: automatische Spracherkennung fehlt."
              )

          checks = [
              (
                  DE,
                  de_check,
                  'data-lang="de" aria-current="page"'
              ),
              (
                  EN,
                  en_check,
                  'data-lang="en" aria-current="page"'
              ),
          ]

          for path, content, active_marker in checks:
              if content.count(
                  "data-language-switch"
              ) != 1:
                  sys.exit(
                      f"FEHLER: Sprachschalter in {path} "
                      "nicht genau einmal vorhanden."
                  )

              if content.count(
                  "data-language-link"
              ) != 2:
                  sys.exit(
                      f"FEHLER: Sprachlinks in {path} "
                      "nicht genau zweimal vorhanden."
                  )

              if active_marker not in content:
                  sys.exit(
                      f"FEHLER: aktive Sprache in {path} "
                      "nicht korrekt markiert."
                  )

              if (
                  'const LANGUAGE_STORAGE_KEY = '
                  '"betinsight_language";'
                  not in content
              ):
                  sys.exit(
                      f"FEHLER: Sprachspeicherung "
                      f"fehlt in {path}."
                  )

          print(
              "OK: DE/EN-Sprachsteuerung vorbereitet."
          )
          PY

      - name: Änderungen prüfen
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "Geänderte Dateien:"
          git status --short

          while read -r FILE
          do
            [ -z "$FILE" ] && continue

            case "$FILE" in
              index.html|de/index.html|en/index.html)
                ;;
              *)
                echo "FEHLER: Unerwartete Datei verändert: $FILE"
                exit 1
                ;;
            esac
          done < <(
            git status --short |
            awk '{print $2}'
          )

      - name: Sprachsteuerung speichern
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "BetInsight Website Builder"

          git config \
            user.email \
            "actions@github.com"

          git add \
            index.html \
            de/index.html \
            en/index.html

          if git diff --cached --quiet; then
            echo "Keine Änderung notwendig."
          else
            git commit \
              -m "Website: DE EN Sprachsteuerung ergänzen"

            git push
          fi
