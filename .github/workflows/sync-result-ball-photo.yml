name: BetInsight Premium Result Photo
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync_result_ball_photo.py'
      - '.github/workflows/sync-result-ball-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: betinsight-premium-result-photo
  cancel-in-progress: false
jobs:
  photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Import licensed football/grass photo from identified source
        run: python .github/scripts/sync_result_ball_photo.py
      - name: Commit photo and license attribution
        run: |
          set -euo pipefail
          git config user.name 'BetInsight Visual Assets'
          git config user.email 'actions@github.com'
          git add assets/brand/result-ball-field-photo-v2.jpg assets/brand/result-ball-field-attribution-v2.json assets/brand/result-photo-inspection-v2.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'assets: licensed sharp soccer ball and turf for dynamic tip reviews'
            git push
          fi
