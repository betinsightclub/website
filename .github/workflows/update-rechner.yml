name: BetInsight Rechner CTA einbauen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Website laden
        uses: actions/checkout@v6

      - name: Rechner aktualisieren
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import sys

          path = Path("de/rechner/index.html")

          if not path.exists():
              sys.exit("FEHLER: de/rechner/index.html fehlt.")

          text = path.read_text(encoding="utf-8")

          if 'id="calculatorRegisterButton"' in text:
              print("OK: CTA bereits vorhanden.")
              sys.exit(0)

          css_marker = "    .disclaimer {"
          html_marker = '    <p class="disclaimer">'
          js_marker = '    simulate();\n  </script>'

          for label, marker in {
              "CSS": css_marker,
              "HTML": html_marker,
              "JavaScript": js_marker,
              "Reset": 'id="resetButton"',
          }.items():
              if marker not in text:
                  sys.exit(f"FEHLER: Einfügepunkt fehlt: {label}")

          css = "\n".join([
              "    .calculator-cta {",
              "      margin-top: 22px;",
              "      padding: 24px;",
              "      text-align: center;",
              "      background: linear-gradient(180deg, var(--panel-soft), var(--panel-deep));",
              "      border: 1px solid var(--border);",
              "      border-radius: 18px;",
              "      box-shadow: 0 15px 34px rgba(0, 0, 0, 0.22);",
              "    }",
              "",
              "    .calculator-cta h2 {",
              "      margin: 0 0 8px;",
              "      font-size: clamp(21px, 3vw, 27px);",
              "    }",
              "",
              "    .calculator-cta p {",
              "      max-width: 680px;",
              "      margin: 0 auto 18px;",
              "      color: var(--text-muted);",
              "      line-height: 1.55;",
              "    }",
              "",
              "    .calculator-cta-actions {",
              "      display: flex;",
              "      flex-wrap: wrap;",
              "      justify-content: center;",
              "      gap: 12px;",
              "    }",
              "",
              "    .calculator-action {",
              "      display: inline-flex;",
              "      align-items: center;",
              "      justify-content: center;",
              "      min-height: 48px;",
              "      padding: 12px 22px;",
              "      border-radius: 999px;",
              "      text-decoration: none;",
              "      text-align: center;",
              "      font-weight: 800;",
              "      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;",
              "    }",
              "",
              "    .calculator-action:hover {",
              "      transform: translateY(-2px);",
              "    }",
              "",
              "    .calculator-back {",
              "      color: var(--text);",
              "      background: rgba(255, 255, 255, 0.045);",
              "      border: 1px solid rgba(255, 255, 255, 0.18);",
              "    }",
              "",
              "    .calculator-back:hover {",
              "      border-color: rgba(22, 199, 243, 0.55);",
              "    }",
              "",
              "    .calculator-register {",
              "      color: #fff;",
              "      border: 1px solid transparent;",
              "      background: linear-gradient(90deg, #168aff, #006fe6);",
              "      box-shadow: 0 10px 24px rgba(0, 132, 255, 0.27);",
              "    }",
              "",
              "    .calculator-register:hover {",
              "      box-shadow: 0 14px 30px rgba(0, 132, 255, 0.38);",
              "    }",
              "",
          ]) + "\n"

          html = "\n".join([
              '    <section class="calculator-cta" aria-labelledby="calculator-cta-title">',
              '      <h2 id="calculator-cta-title">Möchtest du BetInsight selbst ausprobieren?</h2>',
              '      <p>Erstelle deinen kostenlosen BetInsight-Zugang und starte mit 5 kostenlosen Start-Units.</p>',
              '      <div class="calculator-cta-actions">',
              '        <a id="calculatorBackButton" class="calculator-action calculator-back" href="../">← Zurück zu BetInsight</a>',
              '        <a id="calculatorRegisterButton" class="calculator-action calculator-register" href="https://betinsight.systeme.io/registrierung?ref=POOL">Jetzt kostenlos mit 5 Start-Units testen</a>',
              "      </div>",
              "    </section>",
              "",
          ]) + "\n"

          js = "\n".join([
              '    const REF_STORAGE_KEY = "betinsight_ref_code";',
              '    const DEFAULT_REF_CODE = "POOL";',
              "",
              "    function cleanReferralCode(value) {",
              '      if (!value) return "";',
              "      const cleaned = String(value).trim();",
              '      return /^[A-Za-z0-9_-]{2,50}$/.test(cleaned) ? cleaned : "";',
              "    }",
              "",
              "    function getCalculatorReferralCode() {",
              "      const params = new URLSearchParams(window.location.search);",
              '      const fromUrl = cleanReferralCode(params.get("ref") || params.get("ref_code"));',
              "",
              "      if (fromUrl) {",
              "        try {",
              "          localStorage.setItem(REF_STORAGE_KEY, fromUrl);",
              "        } catch (error) {}",
              "",
              "        return fromUrl;",
              "      }",
              "",
              "      try {",
              "        return cleanReferralCode(",
              "          localStorage.getItem(REF_STORAGE_KEY)",
              "        ) || DEFAULT_REF_CODE;",
              "      } catch (error) {",
              "        return DEFAULT_REF_CODE;",
              "      }",
              "    }",
              "",
              "    function updateCalculatorLinks() {",
              "      const refCode = getCalculatorReferralCode();",
              '      const backButton = document.getElementById("calculatorBackButton");',
              '      const registerButton = document.getElementById("calculatorRegisterButton");',
              "",
              "      if (backButton) {",
              '        const backUrl = new URL("../", window.location.href);',
              "",
              "        if (refCode !== DEFAULT_REF_CODE) {",
              '          backUrl.searchParams.set("ref", refCode);',
              "        }",
              "",
              "        backButton.href = backUrl.toString();",
              "      }",
              "",
              "      if (registerButton) {",
              '        const registerUrl = new URL("https://betinsight.systeme.io/registrierung");',
              '        registerUrl.searchParams.set("ref", refCode);',
              "        registerButton.href = registerUrl.toString();",
              "      }",
              "    }",
              "",
              "    updateCalculatorLinks();",
              "",
          ]) + "\n"

          text = text.replace(
              "Version: 2026.07.30-01",
              "Version: 2026.08.19-02",
              1
          )

          text = text.replace(
              css_marker,
              css + css_marker,
              1
          )

          text = text.replace(
              html_marker,
              html + html_marker,
              1
          )

          text = text.replace(
              js_marker,
              js + js_marker,
              1
          )

          mobile_marker = "      .totals { grid-template-columns: 1fr; }"

          if mobile_marker not in text:
              sys.exit("FEHLER: Mobile-Einfügepunkt fehlt.")

          mobile = "\n".join([
              mobile_marker,
              "      .calculator-cta { padding: 20px 15px; }",
              "      .calculator-cta-actions { display: grid; }",
              "      .calculator-action { width: 100%; }",
          ])

          text = text.replace(
              mobile_marker,
              mobile,
              1
          )

          for marker in [
              'id="calculatorBackButton"',
              'id="calculatorRegisterButton"',
              "https://betinsight.systeme.io/registrierung",
              'const REF_STORAGE_KEY = "betinsight_ref_code";',
          ]:
              if marker not in text:
                  sys.exit(f"FEHLER nach Änderung: {marker}")

          if text.count('id="calculatorBackButton"') != 1:
              sys.exit(
                  "FEHLER: Zurück-Button nicht genau einmal vorhanden."
              )

          if text.count('id="calculatorRegisterButton"') != 1:
              sys.exit(
                  "FEHLER: CTA-Button nicht genau einmal vorhanden."
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "OK: Rechner-CTA wurde vorbereitet."
          )
          PY

      - name: Änderung prüfen
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          CHANGED="$(git status --short | awk '{print $2}')"

          echo "Geänderte Datei: $CHANGED"

          test "$CHANGED" = "de/rechner/index.html"

      - name: Rechner speichern
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "BetInsight Website Builder"
          git config user.email "actions@github.com"

          git add de/rechner/index.html

          if git diff --cached --quiet; then
            echo "Keine Änderung notwendig."
          else
            git commit -m "Rechner: Navigation und CTA ergänzen"
            git push
          fi
